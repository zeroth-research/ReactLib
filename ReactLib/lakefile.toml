name = "ReactLib"
version = "0.1.0"
defaultTargets = ["Spec", "Relational"]

# Specifications: LTL formulas over ω-sequences of states and their
# semantics (`Spec.LTL`).
[[lean_lib]]
name = "Spec"

# Matrices (`Relational.Mat`), transition systems (`Relational.Basic`),
# reactive transition systems with their transition-system semantics
# (`Relational.ReactiveTS`), Alur–Henzinger reactive modules and their
# composition (`Relational.Module`), their rounds, runs and traces
# (`Relational.Semantics`), and proof rules stated in `Spec`'s LTL
# (`Relational.ProofRules`).
[[lean_lib]]
name = "Relational"

# Mathlib comes through cslib, at the revision cslib pins. Reactor's
# generated projects require the same cslib, so the two resolve as one.
[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.34.0"
