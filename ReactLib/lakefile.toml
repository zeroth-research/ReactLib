name = "ReactLib"
version = "0.1.0"
defaultTargets = ["Spec", "Relational", "Common"]

# Specifications: LTL formulas over ω-sequences of states and their
# semantics (`Spec.LTL`).
[[lean_lib]]
name = "Spec"

# Matrices (`Relational.Mat`), the box combinators over them
# (`Relational.Circ`), transition systems (`Relational.Basic`), reactive
# modules with their transition-system semantics (`Relational.Module`) and
# proof rules stated in `Spec`'s LTL (`Relational.ProofRules`).
[[lean_lib]]
name = "Relational"

# Atoms and modules over named variables, their composition, and its
# commutativity and associativity (`Common.Module`).
[[lean_lib]]
name = "Common"

# Mathlib comes through cslib, at the revision cslib pins. Reactor's
# generated projects require the same cslib, so the two resolve as one.
[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.34.0"
